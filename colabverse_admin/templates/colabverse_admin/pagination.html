{% if page.has_other_pages %}
    <nav class="pagination" aria-label="Pagination">
        {% if page.has_previous %}
            <a class="button" href="?page={{ page.previous_page_number }}{% if term %}&amp;q={{ term|urlencode }}{% endif %}{% if status %}&amp;status={{ status|urlencode }}{% endif %}">← Previous</a>
        {% endif %}
        <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
        {% if page.has_next %}
            <a class="button" href="?page={{ page.next_page_number }}{% if term %}&amp;q={{ term|urlencode }}{% endif %}{% if status %}&amp;status={{ status|urlencode }}{% endif %}">Next →</a>
        {% endif %}
    </nav>
{% endif %}

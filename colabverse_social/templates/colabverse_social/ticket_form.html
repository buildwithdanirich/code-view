{% extends 'colabverse_social/base.html' %}
{% block title %}New Support Ticket · ColabVerse{% endblock %}
{% block content %}
<h1>Contact support</h1>
<form method="post" class="card form">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}
    <button type="submit">Submit ticket</button>
</form>
{% endblock %}

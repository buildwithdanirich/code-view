{% extends 'users/base_auth.html' %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="section-label">ACCOUNT RECOVERY</div><h2>Reset your password</h2><p class="subtitle">Enter your email address to receive a reset link.</p>
<form method="post" class="auth-form" novalidate>{% csrf_token %}<div class="field"><label for="id_email">Email address</label>{{ form.email }}{{ form.email.errors }}</div><button class="primary-button" type="submit">Send reset link →</button></form>
<p class="switch"><a href="{% url 'login' %}">← Back to sign in</a></p>
{% endblock %}
